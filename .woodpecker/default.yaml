when:
  - event: [push, tag, pull_request, manual]

services:
  - name: database
    image: postgres:18
    environment:
      POSTGRES_DB: monitor_test
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: test123

steps:
  - name: test
    image: harbor.ntppool.org/dev/woodpecker-std/go-test:v1
    settings:
      env:
        TEST_DATABASE_URL: postgres://monitor:test123@database:5432/monitor_test?sslmode=disable
      before:
        - apt update && apt install -y postgresql-client
        - |
          echo "Waiting for database to be ready..."
          for i in $$(seq 1 30); do
            if psql "$$TEST_DATABASE_URL" -c "SELECT 1" >/dev/null 2>&1; then
              echo "Database is ready!"
              break
            fi
            echo "Waiting for database... ($$i/30)"
            sleep 2
          done
        # schema.sql ends with GRANTs to roles the service container does
        # not create; without them ON_ERROR_STOP aborts on that ACL block.
        - psql -v ON_ERROR_STOP=1 "$$TEST_DATABASE_URL" -c "CREATE ROLE ntppool" -c "CREATE ROLE postgres"
        - psql -v ON_ERROR_STOP=1 "$$TEST_DATABASE_URL" -f schema.sql
      # Runs every untagged test too, so there is no separate go test.
      test:
        - make test-integration

  - name: release
    image: harbor.ntppool.org/dev/woodpecker-std/release:v1
    depends_on: [test]
    settings:
      name: ntppool-agent
      env:
        GITHUB_TOKEN:
          from_secret: GITHUB_TOKEN

  - name: docker
    image: harbor.ntppool.org/dev/woodpecker-std/docker:v1
    depends_on: [release]
    settings:
      repo: ntppool/monitor-api
